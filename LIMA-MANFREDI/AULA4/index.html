<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Icone Favorito -->
    <link rel="shortcut icon" href="PRINCIPAL.png" type="image/x-icon">

    <title>FAVICONS e IMAGENS</title>
</head>

<body>

    <h1>Imagens do Google</h1>

    <h2>Vivendo a vida</h2>

    <div>
        <!-- Imagem alinhada à direita -->
        <img 
            src="download.jpg"
            alt="Vivendo a vida"
            title="Vivendo a vida"
            align="right"
        >
    </div>

    <br><br><br><br>

    <h2>Vivendo a vida - com proporção de imagem</h2>

    <div>
        <!-- Imagem com largura e altura definidas -->
        <img 
            src="download.jpg"
            alt="Vivendo a vida"
            title="Vivendo a vida"
            width="800px"
            height="600px"
        >
    </div>

    <h2>Vivendo a vida - com proporção de imagem usando style</h2>

    <div>
        <!-- Imagem usando CSS -->
        <img 
            src="download.jpg"
            alt="Vivendo a vida"
            title="Vivendo a vida"
            style="
                margin: 20px;
                width: 800px;
                height: 600px;
                border-radius: 10px;
                object-fit: cover;
            "
        >
    </div>

</body>
</html>
